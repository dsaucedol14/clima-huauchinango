name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 * * * *' # cada hora
  workflow_dispatch:
    inputs:
      forzar_ia:
        description: 'Pedir un análisis nuevo a Gemini aunque el anterior sea reciente'
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generar pronóstico
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          SITIO_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          FORZAR_IA: ${{ inputs.forzar_ia || github.event_name == 'push' }}
        run: node scripts/generar.js

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - id: despliegue
        uses: actions/deploy-pages@v4
